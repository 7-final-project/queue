server:
  port: 19030

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/

spring:
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_DEV_HOST}
      port: ${REDIS_DEV_PORT}

  datasource:
    url: ${DB_DEV_URL}
    username: ${DB_DEV_USER}
    password: ${DB_DEV_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_DEV_URL}
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: '*'
    topic:
      queue-alarm-event: queue-alarm-event-topic
      reservation-create-event:
        v1: reservation-create-event-topic-v1
        v2: reservation-create-event-topic-v2
        v3: reservation-create-event-topic-v3
        v4: reservation-create-event-topic-v4
        v5: reservation-create-event-topic-.*
      reservation-update-event: reservation-update-event-topic
      queue-reservation-event: queue-reservation-event-topic
      queue-create-fail-event: queue-create-fail-event-topic
      queue-delete-fail-event: queue-delete-fail-event-topic

version:
  v1:
    enabled: true
  v2:
    enabled: false